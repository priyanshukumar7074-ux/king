<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Private Messaging App</title><link rel="stylesheet" href="style.css"></head><body><div class="container"><div id="loginSection" class="login-section"><div class="login-box"><h1>Private Chat</h1><input type="text" id="usernameInput" placeholder="Enter your username" maxlength="20"><button onclick="login()">Login</button></div></div><div id="chatSection" class="chat-section hidden"><div class="header"><h2>Private Chat Room</h2><span id="currentUser" class="current-user"></span></div><div class="chat-container"><div class="sidebar"><h3>Online Users</h3><div id="usersList" class="users-list"></div></div><div class="main-chat"><div id="messageBox" class="message-box"></div><div class="input-section"><select id="recipientSelect" class="recipient-select"><option value="">Select recipient...</option></select><input type="text" id="messageInput" placeholder="Type your message..." onkeypress="handleKeyPress(event)"><button onclick="sendMessage()">Send</button></div></div></div><button onclick="logout()" class="logout-btn">Logout</button></div></div><script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script><script src="script.js"></script></body></html>
